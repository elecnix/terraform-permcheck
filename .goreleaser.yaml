# GoReleaser builds the release binaries when a v* tag is pushed.
# See .github/workflows/release.yml.
version: 2

project_name: terraform-permcheck

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: terraform-permcheck
    main: .
    binary: terraform-permcheck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: terraform-permcheck
    repository:
      owner: elecnix
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/elecnix/terraform-permcheck
    description: Check a Terraform deploy role's IAM policy against the plan before apply
    license: MIT
    # The tap update runs only when the repository has the token secret.
    # `not` reads the token as a boolean and inverts it, so the line says
    # what it does: skip the upload when the secret is missing.
    skip_upload: '{{ not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}'
    hooks:
      post:
        # Homebrew replaced the `postflight` Ruby stanza with the declarative
        # install-steps DSL. `on_macos` is the `OS.mac?` guard, `run` is
        # `system_command`, and `{{ .StagedPath }}` is `#{staged_path}`.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/terraform-permcheck"]
          end

changelog:
  use: github-native
