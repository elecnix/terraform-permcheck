name: CI

on:
  push:
    branches: [main]
  # Every pull request runs CI, including stacked ones based on another
  # pull request's branch rather than main.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test (short)
        run: go test ./... -short -count=1 -v

  test-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (live CFN registry)
        run: go test ./... -count=1 -v

  permissions-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Clones terraform-provider-aws at DefaultProviderRef and parses it.
      - name: Regenerate the embedded permissions table
        run: go run . generate-permissions --out internal/permdata/permissions.json

      - name: Fail on drift
        run: |
          git diff --exit-code -- internal/permdata/permissions.json || {
            echo "::error file=internal/permdata/permissions.json::The embedded permissions table is stale. Run 'go run . generate-permissions --out internal/permdata/permissions.json' and commit the result."
            exit 1
          }

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action with a policy that covers the plan
        id: covered
        uses: ./
        with:
          plan-file: testdata/plan.json
          policy-file: testdata/policy_allow_all.json
          format: text

      - name: Run the action with a policy that misses permissions
        id: partial
        continue-on-error: true
        uses: ./
        with:
          plan-file: testdata/plan.json
          policy-file: testdata/policy_partial.json

      - name: Check the exit codes
        env:
          COVERED: ${{ steps.covered.outputs.exit-code }}
          PARTIAL: ${{ steps.partial.outputs.exit-code }}
          REPORT: ${{ steps.partial.outputs.report-file }}
        run: |
          test "$COVERED" = 0 || { echo "covered run exited $COVERED, want 0"; exit 1; }
          test "$PARTIAL" = 1 || { echo "partial run exited $PARTIAL, want 1"; exit 1; }
          grep -q '::warning' "$REPORT" || { echo "partial report has no annotations"; exit 1; }

  # Builds every release archive the way the tag push does, so a change that
  # breaks the release fails here instead of on the tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
