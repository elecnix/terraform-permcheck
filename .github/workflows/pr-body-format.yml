name: pr-body-format
on:
  pull_request:
    # `edited` re-runs the check once the author fixes the body.
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-body-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: elecnix/gh-pr-body-action@08c74dc0736abe295e90d6363abd55cf7ea63ef3  # v1.2.1
