name: pr-body-format
on:
  pull_request:
    # `edited` re-runs the check once the author fixes the body.
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-body-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: elecnix/gh-pr-body-action@08c74dc0736abe295e90d6363abd55cf7ea63ef3  # v1.2.1
