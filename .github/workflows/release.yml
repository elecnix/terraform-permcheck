name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The version constant in main.go is what the binary prints, so the tag
      # must match it.
      - name: Check the tag matches the version constant
        env:
          TAG: ${{ github.ref_name }}
        run: |
          got="$(go run . version)"
          want="terraform-permcheck $TAG"
          if [ "$got" != "$want" ]; then
            echo "::error::tag $TAG does not match '$got'; bump the version constant in main.go"
            exit 1
          fi

      # The tap update needs a token for the tap repository, which is a
      # separate secret from GITHUB_TOKEN. Without it, GoReleaser skips the
      # cask upload and the release carries no cask. Say so: a silent skip
      # reads like a successful publish.
      - name: Warn when the Homebrew tap secret is missing
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set, so the Homebrew cask was not published and 'brew install terraform-permcheck' will not find it. The release binaries are unaffected. Add the repository secret HOMEBREW_TAP_GITHUB_TOKEN to publish the cask."
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
