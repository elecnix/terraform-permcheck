name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  # Serialised across the whole repository, not per pull request.
  #
  # Every run makes one model call per changed file, all against the same
  # provider key. With a stack of twenty-odd pull requests each started a review
  # within seconds of the others, that is dozens of concurrent calls against one
  # key, and the provider answers HTTP 429 for all of them. A run whose every call
  # is rate limited ends up with no file reviewed, which Cite reports as
  # COULD_NOT_EVALUATE — indistinguishable from a genuinely empty scope, and red.
  #
  # Queued rather than cancelled: cancel-in-progress would make each new pull
  # request cancel the review already in flight for another, so the top of a stack
  # would starve it. A superseded run is cheap next to a missing verdict.
  group: cite-global
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@1c0537ba7f8df4dc5db0651f609f6b8834167150  # v0.11.2
        with:
          # Ollama Cloud is the default provider. Set the CITE_PROVIDER
          # repository variable to "openrouter" to switch this repository
          # back; both keys exist in every repository.
          structured_output: ${{ vars.CITE_PROVIDER == 'openrouter' && 'response_format' || 'tools' }}
          require_parameters: ${{ vars.CITE_PROVIDER == 'openrouter' }}
          model_api_key: ${{ vars.CITE_PROVIDER == 'openrouter' && secrets.MODEL_API_KEY || secrets.OLLAMA_API_KEY }}
          model_base_url: ${{ vars.CITE_PROVIDER == 'openrouter' && 'https://openrouter.ai/api/v1' || 'https://ollama.com/v1' }}
          model_id: ${{ vars.CITE_PROVIDER == 'openrouter' && 'deepseek/deepseek-v4-flash-0731' || 'deepseek-v4.1-flash' }}
