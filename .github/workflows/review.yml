name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  # One queue for the whole repository. Every review makes one model call per
  # changed file against one provider key, so reviews started together, as a
  # pushed stack of pull requests does, get HTTP 429 and evaluate nothing.
  # queue: max keeps up to 100 pending runs in arrival order. Without it,
  # GitHub keeps one pending run per group and cancels the older ones.
  # cancel-in-progress must stay false: GitHub rejects it with queue: max.
  group: cite-global
  cancel-in-progress: false
  queue: max
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@534087b12205e442d971bddd7c157354a0c31da1  # v0.14.0
        with:
          require_parameters: true
          model_api_key: ${{ secrets.MODEL_API_KEY }}
          model_base_url: https://openrouter.ai/api/v1
          model_id: deepseek/deepseek-v4-flash-0731
